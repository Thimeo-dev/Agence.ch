<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agence.ch — Agence de voyage Suisse</title>
    <link rel="icon" type="image/svg+xml" href="AGence.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assistance.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="hero">
            <h1 data-key="assistance_hero_title">Besoin d'aide ou d'une suggestion</h1>
            <p data-key="assistance_hero_text">Demandez-nous n'importe quoi et vous aurez une réponse sous 24 h.</p>
        </section>
        
        <section class="destinations-section">
    <div class="section-header">
    </div>

<form id="chat-form">
    <div class="form-control">
        <input type="text" required="">
        <label>
            <span style="transition-delay:0ms">V</span>
            <span style="transition-delay:50ms">o</span>
            <span style="transition-delay:100ms">t</span>
            <span style="transition-delay:150ms">r</span>
            <span style="transition-delay:200ms">e</span>
            <span style="transition-delay:250ms">&nbsp;</span>
            <span style="transition-delay:300ms">m</span>
            <span style="transition-delay:350ms">e</span>
            <span style="transition-delay:400ms">s</span>
            <span style="transition-delay:450ms">s</span>
            <span style="transition-delay:500ms">a</span>
            <span style="transition-delay:550ms">g</span>
            <span style="transition-delay:600ms">e</span>
        </label>
    </div>
</form>

<section class="chat-box">
</section>

        <section id="services" class="services-grid">
            <div class="service-card">
                <h3 data-key="assistance_service_1_title">Notre Assistance</h3>
                <p data-key="assistance_service_1_desc">Une réponse sous 24h et prise avec tout le cœur.</p>
            </div>
            <div class="service-card">
                <h3 data-key="assistance_service_2_title">Votre Suggestion</h3>
                <p data-key="assistance_service_2_desc">Votre avis compte pour nous, faites-le savoir !</p>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assistance.js" type="module"></script>
    <script src="script.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
