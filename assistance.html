<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Agence.ch — Agence de voyage Suisse</title>
    <link rel="icon" type="image/svg+xml" href="agence180.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="hero">
            <h1>Besoin d'aide ou d'une suggestion</h1>
            <p>Demandez-nous n'importe quoi et vous aurez une réponse sous 24 h.</p>
        </section>
        
        <section class="destinations-section">
    <div class="section-header">
    </div>

<div class="chat-container">
  <div class="chat-field-group">

    <span class="chat-field-highlight"></span>
    <span class="chat-field-bar"></span>
    <label class="chat-field-label" data-key="chat_placeholder">Votre message</label>
  </div>
</div>

<section class="chat-box">

        <button type="submit" class="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </form>
</section>

        <section id="services" class="services-grid">
            <div class="service-card">
                <h3>Notre Assistance</h3>
                <p>Une réponse sous 24h et pris avcec tout le coeur</p>
            </div>
            <div class="service-card">
                <h3>Votre Suggestion</h3>
                <p>Votre avis compte pour nous, fait le savoir !</p>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assistance.js" type="module"></script>
