<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du pays — Agence.ch</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/svg+xml" href="../agence180.svg">
</head>
<body class="legal-page">

    <div id="header-placeholder"></div>

    <main id="country-page-content" class="legal-content">
        
        <main class="country-card-container">
    <section class="hero-country">
        <div id="country-image" class="featured-image">
            <img id="api-country-image" src="" alt="Chargement de l'image..." class="hero-bg">
            <div class="hero-overlay">
                <h1 id="country-title">Chargement...</h1>
            </div>
        </div>
    </section>
    
    <section class="details-country">
        <p id="country-desc" style="line-height: 1.6; font-size: 1.1rem; margin-top: 20px;"></p>
        
        <div class="api-data-box" style="margin-top: 25px; padding: 15px; background: rgba(255,255,255,0.5); border-radius: 12px;">
            <div class="flag-wrapper" style="margin-bottom: 15px;">
                <img id="api-country-flag" src="" alt="Drapeau" style="width: 60px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            </div>
            <p><strong>Capitale :</strong> <span id="api-country-capital">—</span></p>
            <p><strong>Population :</strong> <span id="api-country-population">—</span> habitants</p>
            <p><strong>Monnaie officielle :</strong> <span id="api-country-currency">—</span></p>
        </div>
        
        <p class="lang-indicator" style="margin-top: 30px; opacity: 0.7;">
            Langue : <span id="current-lang" style="font-weight: bold; text-transform: uppercase;"></span>
        </p>
    </section>
    </main>
    </main>


    <div id="footer-placeholder"></div>

    <script src="pays.js" type="module"></script>
    <script src="../main.js" type="module"></script>
    <script src="../destinationjs.js" type="module"></script>
    </body>
</html>
